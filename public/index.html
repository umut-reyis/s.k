<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SANDALYE KAPMACA 3D - MULTIPLAYER</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; margin: 0; padding: 0; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: #070913; color: white; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; display: none; }
        .hud-panel { position: absolute; background: rgba(11, 15, 25, 0.88); border: 1px solid #00d2ff; backdrop-filter: blur(8px); border-radius: 8px; padding: 12px; pointer-events: auto; top: 10px; left: 10px; font-size: 11px; color: #aaa; z-index: 10; }
        .btn-menu-return { margin-top: 6px; background: #ff3333; color: #fff; border: none; padding: 5px 8px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 10px; width: 100%; text-transform: uppercase; }
        #status-board { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(15, 20, 35, 0.9); border: 2px solid #ff00ff; padding: 6px 18px; border-radius: 20px; font-size: 15px; font-weight: 900; color: #ff00ff; z-index: 10; text-align: center; }
        
        #chat-wrapper { position: absolute; bottom: 10px; left: 10px; pointer-events: auto; z-index: 20; display: flex; flex-direction: column; gap: 4px; }
        #chat-container { width: 280px; height: 140px; background: rgba(10, 14, 26, 0.85); border: 1px solid rgba(0, 210, 255, 0.4); border-radius: 8px; display: flex; flex-direction: column; padding: 6px; }
        #chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 10px; margin-bottom: 4px; }
        .chat-msg { word-wrap: break-word; line-height: 1.2; }
        .chat-user { font-weight: bold; color: #00d2ff; }
        #chat-input-box { display: flex; gap: 4px; }
        #chat-input-box input { flex: 1; background: #070913; border: 1px solid #00d2ff; color: #fff; padding: 4px; border-radius: 4px; font-size: 10px; outline: none; }
        #chat-input-box button { background: #00d2ff; color: #000; border: none; padding: 4px 8px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 10px; }

        #touch-right { position: absolute; bottom: 20px; right: 20px; z-index: 100; display: none; }
        #btn-sit { width: 90px; height: 90px; background: rgba(255, 0, 255, 0.9); border: 3px solid #fff; border-radius: 50%; color: white; font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; box-shadow: 0 0 25px rgba(255,0,255,1); }

        #ui-container, #server-browser-container, #lobby-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, rgba(7,9,19,0.96), rgba(30,10,45,0.96)); z-index: 10; padding: 10px; }
        .menu-card, .lobby-card { background: rgba(16,26,43,0.85); border: 2px solid #00d2ff; padding: 18px; border-radius: 14px; text-align: center; max-width: 360px; width: 95%; box-shadow: 0 0 25px rgba(0,210,255,0.3); }
        .menu-card h1 { color: #00d2ff; font-size: 18px; margin-bottom: 8px; }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { font-size: 10px; color: #00d2ff; font-weight: bold; display: block; margin-bottom: 4px; }
        .input-group input { width: 100%; background: #0b0f19; border: 1px solid #00d2ff; padding: 8px; color: white; border-radius: 6px; font-size: 12px; }
        .btn { background: #00d2ff; color: #000; border: none; padding: 10px; font-weight: 900; border-radius: 8px; cursor: pointer; width: 100%; text-transform: uppercase; font-size: 12px; margin-bottom: 8px; }
        .btn-secondary { background: #ff00ff; color: #fff; }

        #server-browser-container, #lobby-container { display: none; z-index: 12; }
        .list-box { background: #070913; border: 1px solid rgba(0,210,255,0.3); border-radius: 8px; height: 120px; overflow-y: auto; padding: 6px; text-align: left; margin-bottom: 8px; font-size: 11px; }
        .server-item { padding: 6px; border-bottom: 1px solid #111936; display: flex; justify-content: space-between; align-items: center; }
        .btn-join-server { background: #00ff66; color: #000; border: none; padding: 4px 8px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 10px; }

        #custom-alert { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 20000; }
        .alert-box { background: #121826; border: 2px solid #ff00ff; border-radius: 12px; padding: 15px; width: 85%; max-width: 320px; text-align: center; }
        .alert-btn { background: #ff00ff; color: #fff; border: none; padding: 8px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="hud">
        <div class="hud-panel">
            Müzik: <span id="music-status" style="color: #00ff66; font-weight: bold;">ÇALIYOR 🎶</span><br>
            Sunucu: <span id="server-id-display" style="color: #00d2ff; font-weight: bold;">-</span><br>
            <button class="btn-menu-return" onclick="location.reload()">MENÜYE DÖN</button>
        </div>
        <div id="status-board">MÜZİK ÇALIYOR DÖN</div>
    </div>

    <div id="touch-right">
        <button id="btn-sit" onclick="requestSit()">OTUR!</button>
    </div>

    <div id="ui-container">
        <div class="menu-card">
            <h1>🪑 SANDALYE KAPMACA (ONLINE)</h1>
            <div class="input-group">
                <label>Kullanıcı Adın:</label>
                <input type="text" id="player-name-input" placeholder="Adınızı girin..." maxlength="20">
            </div>
            <button class="btn" onclick="createServer()">SUNUCU KUR</button>
            <button class="btn btn-secondary" onclick="openServerBrowser()">SUNUCU BUL</button>
        </div>
    </div>

    <div id="server-browser-container">
        <div class="lobby-card">
            <h2 style="color:#00d2ff; font-size:16px; margin-bottom:8px;">SUNUCU LİSTESİ</h2>
            <div class="list-box" id="server-list"></div>
            <button class="btn btn-secondary" onclick="backToMenu()">GERİ DÖN</button>
        </div>
    </div>

    <div id="lobby-container">
        <div class="lobby-card">
            <h2 id="lobby-title" style="color:#00d2ff; font-size:16px; margin-bottom:6px;">LOBİ</h2>
            <div class="list-box" id="lobby-player-list"></div>
            <button class="btn" id="btn-start-match" style="display:none; background:#00ff66; color:#000;" onclick="startMatch()">OYUNU BAŞLAT</button>
            <button class="btn btn-secondary" onclick="location.reload()">AYRIL</button>
        </div>
    </div>

    <div id="custom-alert">
        <div class="alert-box">
            <div id="alert-text" style="font-size:12px; margin-bottom:10px;"></div>
            <button class="alert-btn" onclick="document.getElementById('custom-alert').style.display='none'">TAMAM</button>
        </div>
    </div>

    <script>
        const socket = io();
        let scene, camera, renderer, clock;
        let playerName = "";
        let currentRoomId = null;
        let isHost = false;
        let playerAngle = 0;
        let playerMesh = null;
        let chairMeshes = [];
        let gameState = 'MENU';

        function showAlert(msg) {
            document.getElementById('alert-text').innerText = msg;
            document.getElementById('custom-alert').style.display = 'flex';
        }

        function createServer() {
            playerName = document.getElementById('player-name-input').value.trim();
            if (!playerName) { showAlert("Lütfen kullanıcı adı girin!"); return; }
            socket.emit('createServer', { playerName, serverName: `${playerName}'in Odası`, isAdmin: false });
        }

        socket.on('serverCreated', (data) => {
            currentRoomId = data.roomId;
            isHost = true;
            showLobby(data.room);
        });

        function openServerBrowser() {
            playerName = document.getElementById('player-name-input').value.trim();
            if (!playerName) { showAlert("Lütfen kullanıcı adı girin!"); return; }
            document.getElementById('ui-container').style.display = 'none';
            document.getElementById('server-browser-container').style.display = 'flex';
            socket.emit('getServerList');
        }

        socket.on('updateServerList', (servers) => {
            const listEl = document.getElementById('server-list');
            listEl.innerHTML = '';
            if (servers.length === 0) {
                listEl.innerHTML = '<div style="color:#aaa; text-align:center;">Aktif sunucu yok.</div>';
                return;
            }
            servers.forEach(srv => {
                let div = document.createElement('div');
                div.className = 'server-item';
                div.innerHTML = `<span><b>${srv.name}</b> (${srv.players}/20)</span> <button class="btn-join-server" onclick="joinServer('${srv.id}')">KATIL</button>`;
                listEl.appendChild(div);
            });
        });

        function joinServer(roomId) {
            currentRoomId = roomId;
            socket.emit('joinServer', { roomId, playerName });
        }

        socket.on('updateLobby', (room) => {
            showLobby(room);
        });

        function showLobby(room) {
            document.getElementById('ui-container').style.display = 'none';
            document.getElementById('server-browser-container').style.display = 'none';
            document.getElementById('lobby-container').style.display = 'flex';
            document.getElementById('lobby-title').innerText = room.name;

            let pList = document.getElementById('lobby-player-list');
            pList.innerHTML = '';
            room.players.forEach(p => {
                let d = document.createElement('div');
                d.style.padding = '3px';
                d.innerHTML = `${p.name} ${p.isHost ? '(Kurucu)' : ''}`;
                pList.appendChild(d);
            });

            if (room.hostSocketId === socket.id) {
                document.getElementById('btn-start-match').style.display = 'block';
            }
        }

        function startMatch() {
            socket.emit('startMatch', currentRoomId);
        }

        socket.on('matchStarted', (room) => {
            initGameScreen(room);
        });

        function initGameScreen(room) {
            document.getElementById('lobby-container').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('touch-right').style.display = 'flex';
            document.getElementById('server-id-display').innerText = room.name;
            gameState = 'ROTATING';
            init3D(room);
        }

        socket.on('musicStopped', (room) => {
            gameState = 'STOPPED';
            document.getElementById('music-status').innerText = 'MÜZİK DURDU 🛑';
            document.getElementById('music-status').style.color = '#ff3333';
            document.getElementById('status-board').innerText = 'HEMEN OTUR!';
        });

        function requestSit() {
            socket.emit('trySit', currentRoomId);
        }

        socket.on('playerSatSuccess', (data) => {
            if (data.playerId === socket.id) {
                document.getElementById('status-board').innerText = 'SANDALYE KAPILDI 🎉';
            }
        });

        socket.on('roundResult', (room) => {
            let me = room.players.find(p => p.id === socket.id);
            if (me && me.isEliminated) {
                showAlert("Elendiniz! İzleyici modundasınız.");
                document.getElementById('touch-right').style.display = 'none';
            }
        });

        socket.on('nextRoundStarted', (room) => {
            gameState = 'ROTATING';
            document.getElementById('music-status').innerText = 'ÇALIYOR 🎶';
            document.getElementById('music-status').style.color = '#00ff66';
            document.getElementById('status-board').innerText = 'MÜZİK ÇALIYOR DÖN';
            updateChairs(room.chairs);
        });

        socket.on('gameOver', (data) => {
            showAlert(`OYUN BİTTİ! KAZANAN: ${data.winner.toUpperCase()} 🏆`);
            setTimeout(() => location.reload(), 3000);
        });

        function backToMenu() {
            document.getElementById('server-browser-container').style.display = 'none';
            document.getElementById('ui-container').style.display = 'flex';
        }

        // Three.js Mantığı
        function init3D(room) {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050711);
            clock = new THREE.Clock();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 14, 16);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            let dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(10, 25, 10);
            scene.add(dirLight);

            // Zemin
            let floor = new THREE.Mesh(new THREE.CylinderGeometry(11, 11, 0.5, 32), new THREE.MeshStandardMaterial({ color: 0x111936 }));
            floor.position.y = -0.25;
            scene.add(floor);

            // Karakter
            playerMesh = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.1, 0.35), new THREE.MeshStandardMaterial({ color: 0x00d2ff }));
            playerMesh.position.y = 0.55;
            scene.add(playerMesh);

            updateChairs(room.chairs);
            animate();
        }

        function updateChairs(chairsData) {
            chairMeshes.forEach(c => scene.remove(c));
            chairMeshes = [];

            chairsData.forEach(c => {
                let chair = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.6, 0.7), new THREE.MeshStandardMaterial({ color: 0xff00ff }));
                chair.position.set(c.x, 0.3, c.z);
                scene.add(chair);
                chairMeshes.push(chair);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            let dt = clock.getDelta();

            if (gameState === 'ROTATING') {
                playerAngle += 1.8 * dt;
                if (playerMesh) {
                    playerMesh.position.x = Math.cos(playerAngle) * 6.5;
                    playerMesh.position.z = Math.sin(playerAngle) * 6.5;
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
